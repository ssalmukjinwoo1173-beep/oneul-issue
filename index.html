<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘의 이슈</title>
<style>
:root{--bg:#F2F1EE;--paper:#FFFFFF;--ink:#141414;--muted:#6B6B6B;--line:#DCDAD5;--shelf:#CFCCC6;
--serif:"Noto Serif KR","Nanum Myeongjo",serif;--sans:"Noto Sans KR",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#111111;--paper:#1B1B1B;--ink:#F1F0ED;--muted:#9C9A95;--line:#2D2D2D;--shelf:#2A2A2A;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
.wrap{max-width:900px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 18px 48px;display:flex;flex-direction:column;gap:32px}
.mast{border-bottom:2px solid var(--ink);padding-bottom:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.mast h1{font-family:var(--serif);font-weight:900;font-size:40px;letter-spacing:-.02em;margin:0;line-height:1}
.mast small{font-size:11px;letter-spacing:.18em;color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--muted);margin:0 0 10px}
.latest{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:600px){.latest{grid-template-columns:1fr}.latest .cover{max-width:250px;margin:0 auto}}
.latest h2{font-family:var(--serif);font-weight:900;font-size:28px;line-height:1.25;margin:6px 0 10px;word-break:keep-all}
.latest p{margin:0 0 10px;color:var(--muted);line-height:1.6;word-break:keep-all}
.toc{list-style:none;margin:0 0 14px;padding:0;border-top:1px solid var(--line)}
.toc li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.toc b{font-variant-numeric:tabular-nums;color:var(--acc,var(--ink));min-width:22px}
.cover{position:relative;display:block;width:100%;aspect-ratio:210/297;background:var(--paper);border:0;padding:0;border-radius:2px;overflow:hidden;box-shadow:0 10px 24px -12px rgba(0,0,0,.45)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:14px;text-align:left;background:var(--acc,#333);color:#fff}
.ph .t{font-family:var(--serif);font-weight:900;font-size:20px;line-height:1.25;word-break:keep-all}
.ph .d{font-size:11px;opacity:.85}
.btn{font:inherit;font-weight:700;font-size:15px;border:0;background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px}
.btn[disabled]{opacity:.4}
.shelf h3{font-family:var(--serif);font-size:20px;margin:0 0 12px}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:18px 14px;padding-bottom:14px;border-bottom:6px solid var(--shelf)}
.item{display:flex;flex-direction:column;gap:5px;font-size:12px;line-height:1.35;word-break:keep-all}
.item span{color:var(--muted);font-size:11px}
.empty{background:var(--paper);border:1px dashed var(--line);padding:28px 18px;text-align:center;color:var(--muted)}
#reader{position:fixed;inset:0;background:#0d0d0d;color:#fff;display:flex;flex-direction:column;z-index:9}
#reader[hidden]{display:none}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 8px}
.bar .t{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb{font:inherit;font-size:14px;color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:999px;padding:8px 14px}
#pages{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#pages::-webkit-scrollbar{display:none}
.pg{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:6px 10px;overflow:auto}
.pg img{max-width:100%;max-height:100%;background:#fff}
.foot{display:flex;justify-content:center;align-items:center;gap:16px;padding:8px 0 max(12px,env(safe-area-inset-bottom));font-variant-numeric:tabular-nums;font-size:13px}
</style></head><body>
<div class="wrap">
  <header class="mast"><h1>오늘의 이슈</h1><small>DAILY · 17:00</small></header>
  <section id="latest"></section>
  <section id="shelves" style="display:flex;flex-direction:column;gap:28px"></section>
</div>
<div id="reader" hidden>
  <div class="bar"><div class="t" id="rt"></div><button class="rb" id="close">닫기 ✕</button></div>
  <div id="pages"></div>
  <div class="foot"><button class="rb" id="prev">‹</button><span id="cnt"></span><button class="rb" id="next">›</button></div>
</div>
<script>
var LOADED=Date.now();
function boot(){
var I=(window.ISSUES||[]).slice().sort(function(a,b){return a.date<b.date?1:-1});
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cover(it){var acc=it.accent?' style="--acc:'+esc(it.accent)+'"':"";
 var inner=it.pages.length?'<img src="'+esc(it.pages[0])+'" alt="">':'<span class="ph"><span class="t">'+esc(it.headline)+'</span><span class="d">'+esc(it.dateLabel||it.date)+' · 발행 준비 중</span></span>';
 return '<button class="cover" data-d="'+esc(it.date)+'"'+acc+'>'+inner+'</button>'}
var L=document.getElementById("latest"),S=document.getElementById("shelves");
if(!I.length){L.innerHTML='<div class="empty">아직 발행된 호가 없어요. 매일 17시에 새 호가 들어와요.</div>'}
else{var t=I[0],acc=t.accent?' style="--acc:'+esc(t.accent)+'"':"";
 L.innerHTML='<p class="eyebrow">LATEST · NO.'+esc(t.number||"")+'</p><div class="latest"'+acc+'>'+cover(t)+'<div><div class="eyebrow">'+esc(t.dateLabel||t.date)+(t.edition?' · '+esc(t.edition):'')+'</div><h2>'+esc(t.headline)+'</h2>'+(t.sub?'<p>'+esc(t.sub)+'</p>':'')+
 (t.toc&&t.toc.length?'<ul class="toc">'+t.toc.slice(0,8).map(function(x){return'<li><b>'+esc(x.page)+'</b>'+esc(x.title)+'</li>'}).join("")+'</ul>':'')+
 '<button class="btn" data-d="'+esc(t.date)+'"'+(t.pages.length?'':' disabled')+'>'+(t.pages.length?'읽기 시작':'17시 발행 예정')+'</button></div></div>';
 var m={};I.slice(1).forEach(function(it){var k=it.date.slice(0,7);(m[k]=m[k]||[]).push(it)});
 S.innerHTML=Object.keys(m).sort().reverse().map(function(k){return'<div class="shelf"><h3>'+(+k.slice(0,4))+'년 '+(+k.slice(5))+'월</h3><div class="row">'+m[k].map(function(it){return'<div class="item">'+cover(it)+esc(it.headline)+'<span>'+esc(it.date)+'</span></div>'}).join("")+'</div></div>'}).join("")}
var R=document.getElementById("reader"),P=document.getElementById("pages");
function idx(){return Math.round(P.scrollLeft/Math.max(1,P.clientWidth))}
function cnt(){document.getElementById("cnt").textContent=(idx()+1)+" / "+P.children.length}
function open(d){var it=I.filter(function(x){return x.date===d})[0];if(!it||!it.pages.length)return;
 document.getElementById("rt").textContent=(it.dateLabel||it.date)+"  "+it.headline;
 P.innerHTML=it.pages.map(function(p,i){return'<div class="pg"><img src="'+esc(p)+'" alt="'+(i+1)+'쪽"'+(i>1?' loading="lazy"':'')+'></div>'}).join("");
 R.hidden=false;P.scrollLeft=0;cnt();history.pushState({r:1},"")}
function close(){R.hidden=true}
document.addEventListener("click",function(e){var b=e.target.closest("[data-d]");if(b)open(b.getAttribute("data-d"))});
document.getElementById("close").onclick=function(){history.back()};
window.addEventListener("popstate",close);
document.getElementById("prev").onclick=function(){P.scrollTo({left:(idx()-1)*P.clientWidth,behavior:"smooth"})};
document.getElementById("next").onclick=function(){P.scrollTo({left:(idx()+1)*P.clientWidth,behavior:"smooth"})};
P.addEventListener("scroll",function(){requestAnimationFrame(cnt)},{passive:true});
}
(function(){var s=document.createElement("script");s.src="issues.js?t="+Date.now();s.onload=boot;s.onerror=boot;document.head.appendChild(s)})();
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&Date.now()-LOADED>20*60*1000&&document.getElementById("reader").hidden)location.reload()});
</script></body></html>
